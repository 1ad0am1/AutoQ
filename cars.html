<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoQ | بيع السيارات</title>
<style>
:root{--bg:#07090c;--panel:#0e1319;--line:#252c34;--white:#fff;--mut:#aab1b9;--orange:#ff6b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Tahoma,sans-serif}.container{width:min(1400px,calc(100% - 42px));margin:auto}.top{height:78px;border-bottom:1px solid #fff1;background:#080a0de8;display:flex;align-items:center}.row{display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-size:32px;font-weight:900}.logo span{color:var(--orange)}a{text-decoration:none;color:inherit}.hero{min-height:390px;display:flex;align-items:center;position:relative;background:linear-gradient(90deg,#050607ee,#05060780,#05060733),url('hero-autoq.png') center/cover}.hero h1{font-size:clamp(45px,7vw,82px);margin:0 0 12px}.hero h1 span{color:var(--orange)}.hero p{color:#d3d8dc;font-size:18px}.filters{background:#0d1218;border:1px solid #ffffff1b;border-radius:18px;padding:16px;margin-top:-45px;position:relative;z-index:3;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:9px;box-shadow:0 25px 70px #0008}.filters select,.filters input{width:100%;background:#111820;border:1px solid #29313a;color:#fff;border-radius:10px;padding:13px}.filters label{display:block;color:#8f98a1;font-size:11px;margin-bottom:6px}.btn{border:0;border-radius:10px;padding:13px 20px;font-weight:900}.primary{background:var(--orange);color:#fff}.section{padding:60px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h2{font-size:30px;margin:0}.head p{color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;color:#111;border-radius:15px;overflow:hidden}.pic{height:235px;background:linear-gradient(145deg,#181b20,#0c0e11);display:grid;place-items:center;font-size:70px}.body{padding:16px}.badge{display:inline-block;background:#fff0e6;color:#c75200;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:800}.body h3{margin:10px 0 6px;font-size:20px}.meta{color:#737980;font-size:13px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.price{font-size:21px;font-weight:900}.footer{border-top:1px solid var(--line);padding:35px 0;color:var(--mut)}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.container{width:calc(100% - 24px)}.filters,.grid{grid-template-columns:1fr}.hero{min-height:420px}.hero h1{font-size:48px}}
</style></head><body>
<header class="top"><div class="container row"><a class="logo" href="index.html">Auto<span>Q</span></a><div><a href="index.html">الرئيسية</a> &nbsp; | &nbsp; <b style="color:#ff6b00">بيع السيارات</b></div></div></header>
<section class="hero"><div class="container"><div style="max-width:700px"><span style="color:#ff8a26;font-weight:800">🚘 AUTOQ MOTORS</span><h1>بيع السيارات<br><span>بشكل احترافي</span></h1><p>قسم مستقل للسيارات المعروضة للبيع داخل مصر، مع فلترة حسب الماركة والموديل والسعر والمحافظة.</p></div></div></section>
<div class="container"><div class="filters"><div><label>الماركة</label><select id="brand"><option>كل الماركات</option><option>Mercedes-Benz</option><option>BMW</option><option>Audi</option><option>Toyota</option><option>Nissan</option><option>Hyundai</option><option>Kia</option><option>Chery</option><option>BYD</option></select></div><div><label>الموديل</label><select id="model"><option>كل الموديلات</option><option>C200</option><option>BMW X5</option><option>520i</option><option>Corolla</option><option>Sunny</option><option>Elantra</option><option>Sportage</option></select></div><div><label>من السعر</label><input id="min" type="number" placeholder="ج.م"></div><div><label>إلى السعر</label><input id="max" type="number" placeholder="ج.م"></div><button class="btn primary" onclick="filterCars()">بحث</button></div></div>
<section class="section container"><div class="head"><div><h2>السيارات المتاحة</h2><p>البيانات المعروضة حاليًا داخل الموقع.</p></div><span id="count" style="color:#ff8a26;font-weight:900"></span></div><div id="grid" class="grid"></div></section>
<footer class="footer"><div class="container">AutoQ © 2026 — سوق السيارات وقطع الغيار</div></footer>
<script>
const cars=[
['Mercedes-Benz C200 2023','2,650,000','38,000 كم','أوتوماتيك','الجيزة','🇩🇪'],
['BMW X5 2024 xDrive40i','5,950,000','50,000 كم','أوتوماتيك','القاهرة','🇩🇪'],
['BMW 520i 2026 Luxury','4,000,000','12,000 كم','أوتوماتيك','القاهرة','🇩🇪'],
['Toyota Corolla 2022','1,150,000','80,000 كم','أوتوماتيك','القاهرة','🇯🇵'],
['Nissan Sunny 2024','800,000','10,000 كم','أوتوماتيك','الجيزة','🇯🇵'],
['Hyundai Elantra CN7 2022','1,149,000','67,000 كم','أوتوماتيك','القاهرة','🇰🇷'],
['Kia Sportage 2025','2,550,000','11,000 كم','أوتوماتيك','الإسكندرية','🇰🇷'],
['Chery Tiggo 7 2024','1,050,000','30,000 كم','أوتوماتيك','القاهرة','🇨🇳'],
['BYD Song Plus 2025','1,650,000','9,000 كم','أوتوماتيك','الجيزة','🇨🇳']];
function render(a){count.textContent=a.length+' سيارة';grid.innerHTML=a.map(c=>'<article class="card"><div class="pic">🚘</div><div class="body"><span class="badge">'+c[5]+' مصر</span><h3>'+c[0]+'</h3><div class="meta">'+c[2]+' • '+c[3]+' • '+c[4]+'</div><div class="bottom"><strong class="price">'+c[1]+' ج.م</strong><button class="btn primary" onclick="alert(\'للتواصل وإتمام البيع: سجل دخولك ثم تواصل مع AutoQ\')">تفاصيل</button></div></div></article>').join('')}
function filterCars(){const b=brand.value,m=model.value,mi=Number(min.value||0),ma=Number(max.value||Infinity);render(cars.filter(c=>(b==='كل الماركات'||c[0].startsWith(b))&&(m==='كل الموديلات'||c[0].includes(m.replace('BMW ','')))&&Number(c[1].replaceAll(',',''))>=mi&&Number(c[1].replaceAll(',',''))<=ma))}
render(cars);
</script></body></html>
