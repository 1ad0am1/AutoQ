<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoQ | بيع السيارات</title><style> :root{--o:#ff6b00;--line:#e7e7e7;--mut:#777}*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#eef1f4;color:#151515}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#ffffffd9,#ffffffd9),url('assets/automotive-bg.jpg') center/cover no-repeat;opacity:.2;z-index:-1}.top{background:#0b0b0b;color:#fff;padding:9px 0;font-size:12px}.top .container{display:flex;justify-content:space-between}.nav{background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}.navrow{height:78px;display:flex;align-items:center;gap:22px}.logo{font-weight:900;font-size:30px}.logo span{color:var(--o)}.back{margin-right:auto;font-weight:800}.back:hover{color:var(--o)}.hero{color:#fff;padding:75px 0;background:linear-gradient(90deg,#05080ced,#111a23b8),url('assets/automotive-bg.jpg') center/cover no-repeat}.hero h1{font-size:42px;margin:0 0 10px}.hero h1 span{color:var(--o)}.hero p{color:#ddd;margin:0}.box{background:#fff;border-radius:18px;padding:20px;margin-top:22px;box-shadow:0 10px 35px #00000012}.filters{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:10px}label{display:block;font-size:11px;color:#777;margin-bottom:6px}select,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;background:#fff}button{border:0;background:var(--o);color:#fff;padding:12px 22px;border-radius:9px;font-weight:900;cursor:pointer}.section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}.section-title h2{margin:0}.tag{background:#fff1e8;color:#c84e00;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:800}.cars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.car{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 7px 24px #0000000b}.visual{height:210px;background:linear-gradient(135deg,#111,#3a3a3a);display:flex;align-items:center;justify-content:center;color:#fff;font-size:76px;position:relative}.flag{position:absolute;top:12px;right:12px;background:#fff;border-radius:20px;padding:6px 10px;font-size:12px;color:#222}.info{padding:15px}.info h3{margin:8px 0;font-size:18px}.price{font-size:21px;font-weight:900}.mut{color:var(--mut);font-size:12px;margin-top:7px}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1}.ghost{background:#fff;color:#111;border:1px solid #ddd}.empty{padding:45px;text-align:center;color:#777;background:#fff;border-radius:15px}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.cars{grid-template-columns:1fr 1fr}}@media(max-width:520px){.filters,.cars{grid-template-columns:1fr}.hero h1{font-size:31px}}</style></head><body><div class="top"><div class="container"><span>AutoQ — سوق السيارات</span><span>مصر 🇪🇬</span></div></div><header class="nav"><div class="container navrow"><a class="logo" href="index.html">Auto<span>Q</span></a><a class="back" href="index.html">← العودة للرئيسية</a></div></header><section class="hero"><div class="container"><h1>🚘 بيع السيارات <span>في مصر</span></h1><p>قسم مستقل للسيارات المعروضة للبيع — اختار الماركة والسعر والمحافظة.</p></div></section><main class="container"><div class="box"><div class="filters"><div><label>الماركة</label><select id="brand"><option value="">كل الماركات</option><option>BMW</option><option>Mercedes-Benz</option><option>Audi</option><option>Renault</option><option>Nissan</option><option>Toyota</option><option>Hyundai</option><option>Kia</option><option>Chery</option><option>BYD</option><option>MG</option></select></div><div><label>السعر من</label><input id="min" type="number" placeholder="ج.م"></div><div><label>السعر إلى</label><input id="max" type="number" placeholder="ج.م"></div><div><label>المحافظة</label><select id="gov"><option value="">كل المحافظات</option><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option></select></div><button onclick="filterCars()">بحث</button></div></div><div class="section-title"><h2>السيارات المتاحة</h2><span class="tag">🇪🇬 مصر</span></div><div class="cars" id="grid"></div></main><script>const cars=[['BMW 520i 2026 Luxury','4000000','12,000 كم','أوتوماتيك','القاهرة'],
['BMW X5 2024 xDrive40i','5950000','50,000 كم','أوتوماتيك','القاهرة'],
['Mercedes-Benz C200 2023','2650000','38,000 كم','أوتوماتيك','الجيزة'],
['Audi A4 2022','1850000','62,000 كم','أوتوماتيك','القاهرة'],
['Renault Megane 2023 1.6','1030000','65,000 كم','أوتوماتيك','الإسكندرية'],
['Nissan Sunny 2024 1.5','800000','10,000 كم','أوتوماتيك','القاهرة'],
['Toyota Corolla 2022 1.6','1150000','80,000 كم','أوتوماتيك','القاهرة'],
['Hyundai Elantra CN7 2022','1149000','67,000 كم','أوتوماتيك','الجيزة'],
['Kia Sportage 2025','2550000','11,000 كم','أوتوماتيك','القاهرة'],
['Chery Tiggo 7 2024','980000','22,000 كم','أوتوماتيك','الإسكندرية'],
['BYD Song Plus 2025','1650000','8,000 كم','أوتوماتيك','القاهرة'],
['MG HS 2024','1450000','18,000 كم','أوتوماتيك','الجيزة']];function brand(n){return n.startsWith('Mercedes-Benz ')?'Mercedes-Benz':n.split(' ')[0]}function origin(b){const m={BMW:['🇩🇪','ألمانيا'],'Mercedes-Benz':['🇩🇪','ألمانيا'],Audi:['🇩🇪','ألمانيا'],Renault:['🇫🇷','فرنسا'],Nissan:['🇯🇵','اليابان'],Toyota:['🇯🇵','اليابان'],Hyundai:['🇰🇷','كوريا الجنوبية'],Kia:['🇰🇷','كوريا الجنوبية'],Chery:['🇨🇳','الصين'],BYD:['🇨🇳','الصين'],MG:['🇬🇧','المملكة المتحدة']};return m[b]||['🌍','']}function money(v){return Number(v).toLocaleString('ar-EG')}function render(list=cars){const el=document.getElementById('grid');el.innerHTML=list.length?list.map(c=>{const b=brand(c[0]),o=origin(b);return `<article class="car"><div class="visual"><span class="flag">${o[0]} ${o[1]} • 🇪🇬 مصر</span>🚘</div><div class="info"><h3>${c[0]}</h3><div class="price">${money(c[1])} ج.م</div><div class="mut">${c[2]} • ${c[3]} • ${c[4]}</div><div class="actions"><button onclick="alert('تفاصيل السيارة سيتم ربطها بصفحة الإعلان لاحقًا')">عرض التفاصيل</button><button class="ghost" onclick="alert('سجّل الدخول لإضافة السيارة للمفضلة')">♡ المفضلة</button></div></div></article>`}).join(''):'<div class="empty">لا توجد سيارات مطابقة للفلاتر.</div>'}function filterCars(){const b=document.getElementById('brand').value,min=Number(document.getElementById('min').value||0),max=Number(document.getElementById('max').value||0),g=document.getElementById('gov').value;render(cars.filter(c=>(!b||brand(c[0])===b)&&(!min||Number(c[1])>=min)&&(!max||Number(c[1])<=max)&&(!g||c[4]===g)))}render();</script></body></html>
