<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoQ | بيع السيارات</title>
<style>
:root{--bg:#07090c;--panel:#0d1218;--panel2:#111820;--line:#252c34;--white:#f7f8fa;--mut:#aab1b9;--orange:#ff6b00;--orange2:#ff8a26;--shadow:0 28px 80px #0009}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% 0,#151b22 0,#080b0f 38%,#050608 100%);color:var(--white);font-family:Arial,Tahoma,sans-serif}.container{width:min(1400px,calc(100% - 42px));margin:auto}a{text-decoration:none;color:inherit}.top{height:78px;border-bottom:1px solid #fff1;background:#07090ee8;backdrop-filter:blur(18px);display:flex;align-items:center;position:sticky;top:0;z-index:30}.row{display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-size:32px;font-weight:1000;letter-spacing:-2px}.logo span{color:var(--orange)}.back{color:#c9ced3;font-size:13px}.hero{min-height:470px;display:flex;align-items:center;position:relative;overflow:hidden;background:linear-gradient(90deg,#040609f2 0%,#05080db8 44%,#05080d40 100%),url('autoq-hero-clean.png?v=3') center/cover}.hero:after{content:'';position:absolute;inset:auto 0 0;height:150px;background:linear-gradient(transparent,#07090c)}.heroInner{position:relative;z-index:2;padding:70px 0}.eyebrow{display:inline-flex;padding:8px 13px;border-radius:99px;border:1px solid #ff6b0045;background:#ff6b0014;color:#ff9b50;font-weight:900;font-size:12px}.hero h1{font-size:clamp(46px,7vw,82px);line-height:.98;margin:18px 0 15px;letter-spacing:-3px}.hero h1 span{color:var(--orange)}.hero p{max-width:690px;color:#d6dbe0;font-size:17px;line-height:1.9;margin:0}.filters{background:#0b1015f2;border:1px solid #ffffff22;border-radius:20px;padding:16px;margin-top:-48px;position:relative;z-index:5;display:grid;grid-template-columns:1.25fr 1.25fr 1fr 1fr auto;gap:10px;box-shadow:var(--shadow);backdrop-filter:blur(15px)}.filters>div{min-width:0}.filters label{display:block;color:#8f98a1;font-size:11px;margin:2px 9px 6px}.filters select,.filters input{width:100%;height:48px;background:#111820;border:1px solid #29313a;color:#fff;border-radius:11px;padding:0 13px;outline:none}.filters select:focus,.filters input:focus{border-color:#ff6b0080}.btn{border:0;border-radius:11px;padding:13px 21px;font-weight:900}.primary{background:var(--orange);color:#fff;box-shadow:0 10px 28px #ff6b0025}.searchAction{height:48px;align-self:end}.section{padding:62px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px;gap:20px}.head h2{font-size:30px;margin:0}.head p{color:var(--mut);margin:7px 0 0}.count{padding:8px 12px;border:1px solid #ff6b0030;background:#ff6b0012;color:#ff9b50;border-radius:99px;font-weight:900;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(145deg,#ffffff,#eceff1);color:#111;border-radius:18px;overflow:hidden;border:1px solid #ffffff20;box-shadow:0 15px 40px #0005;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-5px);box-shadow:0 22px 55px #0008}.pic{height:245px;position:relative;background:#111820;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;filter:saturate(.9);transform:scale(1.02)}.pic:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#05070db5,transparent 48%)}.year{position:absolute;right:14px;top:14px;z-index:2;background:#05080dcc;color:#fff;border:1px solid #ffffff25;padding:7px 10px;border-radius:99px;font-size:11px;font-weight:900}.body{padding:17px}.badge{display:inline-flex;align-items:center;gap:7px;background:#fff0e6;color:#c75200;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:800}.badge img{width:25px;height:17px;object-fit:cover;border-radius:3px;border:1px solid #0002}.body h3{margin:11px 0 8px;font-size:20px}.meta{color:#697078;font-size:13px;line-height:1.8}.specs{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.spec{padding:6px 8px;border-radius:8px;background:#f0f2f3;color:#555;font-size:11px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:17px;padding-top:14px;border-top:1px solid #ddd}.price{font-size:21px;font-weight:1000}.empty{padding:60px;text-align:center;border:1px dashed #ffffff22;border-radius:16px;color:var(--mut)}.footer{border-top:1px solid var(--line);padding:35px 0;color:var(--mut);margin-top:20px}.footer .logo{color:#fff}
@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr}.searchAction{width:100%}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.container{width:calc(100% - 24px)}.hero{min-height:430px}.hero h1{font-size:50px}.hero p{font-size:15px}.filters,.grid{grid-template-columns:1fr}.filters{margin-top:-35px}.top{height:68px}.logo{font-size:28px}.head{align-items:start;flex-direction:column}.pic{height:225px}}
</style></head><body>
<header class="top"><div class="container row"><a class="logo" href="index.html">Auto<span>Q</span></a><div><a href="index.html">الرئيسية</a> &nbsp; | &nbsp; <b style="color:#ff6b00">بيع السيارات</b></div></div></header>
<section class="hero"><div class="container"><div style="max-width:700px"><span style="color:#ff8a26;font-weight:800">🚘 AUTOQ MOTORS</span><h1>بيع السيارات<br><span>بشكل احترافي</span></h1><p>قسم مستقل للسيارات المعروضة للبيع داخل مصر، مع فلترة حسب الماركة والموديل والسعر والمحافظة.</p></div></div></section>
<div class="container"><div class="filters"><div><label>الماركة</label><select id="brand"><option value="">كل الماركات</option><option>Mercedes-Benz</option><option>Hyundai</option><option>Kia</option><option>Renault</option><option>Chevrolet</option><option>BMW</option><option>Nissan</option><option>Fiat</option><option>Skoda</option><option>Opel</option><option>Peugeot</option><option>Toyota</option><option>Daewoo</option><option>Volkswagen</option><option>Mitsubishi</option><option>MG</option><option>Suzuki</option><option>Chery</option><option>SEAT</option><option>Jeep</option><option>Changan</option><option>BYD</option><option>Audi</option><option>Citroën</option><option>Geely</option><option>Ford</option><option>Honda</option><option>Lada</option><option>Jetour</option><option>Mazda</option><option>Proton</option><option>Porsche</option><option>Daihatsu</option><option>Mini</option><option>Cupra</option><option>Brilliance</option><option>Land Rover</option><option>Subaru</option><option>Soueast</option><option>Volvo</option><option>JAC</option><option>SsangYong</option><option>BAIC</option><option>Range Rover</option><option>Avatr</option><option>Jaguar</option><option>Haval</option><option>Alfa Romeo</option><option>Xiaomi</option><option>GMC</option><option>Tesla</option><option>Chrysler</option><option>Cadillac</option><option>Dodge</option><option>Zeekr</option><option>GAC</option><option>Senova</option><option>Saipa</option><option>Maserati</option><option>Isuzu</option><option>Changhe</option><option>DFSK</option><option>Zotye</option><option>Great Wall</option><option>DS</option><option>XPeng</option><option>Bestune</option><option>Bentley</option><option>Shineray</option><option>Aston Martin</option><option>Chana</option><option>Lamborghini</option><option>Haima</option><option>Infiniti</option><option>Lexus</option><option>Mahindra</option><option>Rolls-Royce</option><option>Lotus</option><option>Dongfeng</option><option>Hongqi</option><option>GAC Aion</option></select></div><div><label>الموديل</label><select id="model"><option value="">كل الموديلات</option></select></div><div><label>من السعر</label><input id="min" type="number" placeholder="ج.م"></div><div><label>إلى السعر</label><input id="max" type="number" placeholder="ج.م"></div><button class="btn primary" onclick="filterCars()">بحث</button></div></div>
<section class="section container"><div class="head"><div><h2>السيارات المتاحة</h2><p>البيانات المعروضة حاليًا داخل الموقع.</p></div><span id="count" style="color:#ff8a26;font-weight:900"></span></div><div id="grid" class="grid"></div></section>
<footer class="footer"><div class="container">AutoQ © 2026 — سوق السيارات وقطع الغيار</div></footer>
<script src="assets/vehicle-data.js?v=3"></script><script>
const cars=[
['Mercedes-Benz C200 2023','2,650,000','38,000 كم','أوتوماتيك','الجيزة','🇩🇪'],
['BMW X5 2024 xDrive40i','5,950,000','50,000 كم','أوتوماتيك','القاهرة','🇩🇪'],
['BMW 520i 2026 Luxury','4,000,000','12,000 كم','أوتوماتيك','القاهرة','🇩🇪'],
['Toyota Corolla 2022','1,150,000','80,000 كم','أوتوماتيك','القاهرة','🇯🇵'],
['Nissan Sunny 2024','800,000','10,000 كم','أوتوماتيك','الجيزة','🇯🇵'],
['Hyundai Elantra CN7 2022','1,149,000','67,000 كم','أوتوماتيك','القاهرة','🇰🇷'],
['Kia Sportage 2025','2,550,000','11,000 كم','أوتوماتيك','الإسكندرية','🇰🇷'],
['Chery Tiggo 7 2024','1,050,000','30,000 كم','أوتوماتيك','القاهرة','🇨🇳'],
['BYD Song Plus 2025','1,650,000','9,000 كم','أوتوماتيك','الجيزة','🇨🇳']];
function flagSrc(f){return f==='🇩🇪'?'assets/flags/germany.png':f==='🇯🇵'?'assets/flags/japan.png':f==='🇰🇷'?'assets/flags/korea.png':f==='🇨🇳'?'assets/flags/china.png':'';}
function render(a){count.textContent=a.length+' سيارة';grid.innerHTML=a.length?a.map((c,i)=>{const year=(c[0].match(/20\d{2}/)||[''])[0];return '<article class="card"><div class="pic"><img src="autoq-hero-clean.png?v=3" alt="'+c[0]+'" loading="lazy"><span class="year">'+year+'</span></div><div class="body"><span class="badge"><img src="'+flagSrc(c[5])+'" alt="علم">'+c[5]+' مصر</span><h3>'+c[0]+'</h3><div class="meta">'+c[2]+' • '+c[3]+' • '+c[4]+'</div><div class="specs"><span class="spec">✓ فحص بيانات</span><span class="spec">✓ داخل مصر</span></div><div class="bottom"><strong class="price">'+c[1]+' ج.م</strong><button class="btn primary" onclick="alert(\"للتواصل وإتمام البيع: سجل دخولك ثم تواصل مع AutoQ\")">تفاصيل السيارة</button></div></div></article>'}).join(''):'<div class="empty">لا توجد سيارات مطابقة للفلاتر الحالية.</div>'}
const brandSelect=document.getElementById('brand');
const modelSelect=document.getElementById('model');
function populateModels(selectEl, brandValue){
  const db=window.AUTOQ_BRAND_MODELS||{};
  const key=Object.keys(db).find(k=>k.toLowerCase()===String(brandValue||'').trim().toLowerCase());
  const models=key ? db[key] : Object.values(db).flat();
  const uniq=[...new Set(models.filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  selectEl.innerHTML='<option value="">'+(key?'كل الموديلات':'اختر الماركة أولًا')+'</option>'+uniq.map(x=>'<option value="'+x.replace(/"/g,'&quot;')+'">'+x+'</option>').join('');
  selectEl.disabled=!key;
}
function updateModels(){populateModels(modelSelect,brandSelect.value);}
brandSelect.addEventListener('change',updateModels);
updateModels();
function filterCars(){const b=brandSelect.value,m=modelSelect.value,mi=Number(min.value||0),ma=Number(max.value||Infinity);render(cars.filter(c=>(!b||c[0].startsWith(b))&&(!m||c[0].toLowerCase().includes(m.toLowerCase()))&&Number(c[1].replaceAll(',',''))>=mi&&Number(c[1].replaceAll(',',''))<=ma))}
render(cars);
</script></body></html>
